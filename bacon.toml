#:schema https://dystroy.org/bacon/.bacon.schema.json

default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true

[jobs.clippy]
command = [
    "cargo",
    "clippy",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]
need_stdout = false

[jobs.fmt]
command = ["cargo", "fmt", "--check"]
need_stdout = true

# Keep bacon jobs non-interactive. Running Worktrack itself inside bacon can
# leave the terminal alternate screen and mouse capture in a bad state.
[jobs.smoke]
command = ["cargo", "run", "--", "--help"]
need_stdout = true
allow_warnings = false

# Override bacon's built-in run jobs so project shortcuts never nest the
# interactive TUI inside bacon's own TUI.
[jobs.run]
command = ["./scripts/bacon-run-disabled"]
need_stdout = true
allow_warnings = false

[jobs.run-long]
command = ["./scripts/bacon-run-disabled"]
need_stdout = true
allow_warnings = false

[keybindings]
c = "job:clippy"
f = "job:fmt"
r = "job:smoke"
s = "job:smoke"
t = "job:test"
