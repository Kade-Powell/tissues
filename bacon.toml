# This is a configuration file for the bacon tool.
#
# Bacon repository: https://github.com/Canop/bacon
# Complete help on configuration: https://dystroy.org/bacon/config/
# Ratatui's bacon.toml is a useful reference:
# https://github.com/ratatui/ratatui/blob/main/bacon.toml
#
# Keep this file for non-interactive project jobs. Run the real TUI with
# ./scripts/dev-tui in a normal terminal so bacon doesn't own the alternate
# screen or mouse capture.

default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check", "--all-targets"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check", "--all-targets", "--all-features"]
need_stdout = false

[jobs.test]
command = ["cargo", "test"]
need_stdout = true

[jobs.test-unit]
command = ["cargo", "test", "--lib"]
need_stdout = true

[jobs.clippy]
command = [
    "cargo",
    "clippy",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]
need_stdout = false

[jobs.clippy-all]
command = [
    "cargo",
    "clippy",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]
need_stdout = false

[jobs.fmt]
command = ["cargo", "fmt", "--check"]
need_stdout = true

[jobs.format]
command = ["cargo", "fmt", "--check"]
need_stdout = true

[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false

[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--open"]
on_success = "job:doc"
need_stdout = false

# Keep bacon jobs non-interactive. Running tissue itself inside bacon can
# leave the terminal alternate screen and mouse capture in a bad state.
[jobs.smoke]
command = ["cargo", "run", "--", "--help"]
need_stdout = true
allow_warnings = false

# Override bacon's built-in run jobs so project shortcuts never nest the
# interactive TUI inside bacon's own TUI.
[jobs.run]
command = ["./scripts/bacon-run-disabled"]
need_stdout = true
allow_warnings = false

[jobs.run-long]
command = ["./scripts/bacon-run-disabled"]
need_stdout = true
allow_warnings = false

[keybindings]
c = "job:clippy"
d = "job:doc"
f = "job:fmt"
r = "job:smoke"
s = "job:smoke"
t = "job:test"
u = "job:test-unit"
