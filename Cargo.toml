[package]
name = "skunkwork"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
octocrab = "0.50.0"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tachyonfx = "0.25.0"
throbber-widgets-tui = "0.11.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tui-markdown = { version = "0.3.7", default-features = false }
tui-scrollview = "0.6.4"
tui-tree-widget = { version = "0.24.0", default-features = false }

[dev-dependencies]
insta = "1.47.2"
