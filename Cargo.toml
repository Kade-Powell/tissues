[package]
name = "worktrack"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
octocrab = "0.50.0"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tachyonfx = "0.25.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
insta = "1.47.2"
