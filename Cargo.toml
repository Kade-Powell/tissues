[package]
name = "tissues"
version = "0.6.0"
edition = "2024"
description = "A Rust terminal app for working through GitHub issues in one repository at a time"
repository = "https://github.com/Kade-Powell/tissues"
readme = "README.md"
license = "MIT"
keywords = ["github", "issues", "terminal", "tui", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "tissues"
path = "src/lib.rs"

[[bin]]
name = "tissues"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
octocrab = "0.50.0"
ratatui = "0.30.1"
ratatui-textarea = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tachyonfx = "0.25.0"
throbber-widgets-tui = "0.11.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tui-markdown = { version = "0.3.7", default-features = false }
tui-realm-stdlib = "4.1.0"
tui-realm-textarea = "4.1.0"
tui-realm-treeview = "4.1.0"
tui-scrollview = "0.6.4"
tui-tree-widget = { version = "0.24.0", default-features = false }
tuirealm = "4.1.0"

[dev-dependencies]
insta = "1.47.2"
