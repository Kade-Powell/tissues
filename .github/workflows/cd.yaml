name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-cli-crates-io:
    uses: ./.github/workflows/publish-cli-crates-io.yaml
    with:
      version_tag: ${{ github.event.release.tag_name }}
      runner_label: ubuntu-latest
      timeout_minutes: 20
      allow_existing: false
      dry_run: false
    secrets:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
