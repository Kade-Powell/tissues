name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commits:
    name: Commit message checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check Conventional Commit messages
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            mapfile -t COMMITS < <(git rev-list --reverse "origin/${{ github.base_ref }}..HEAD")
          else
            COMMITS=("${{ github.sha }}")
          fi

          for sha in "${COMMITS[@]}"; do
            git log --format=%B -n 1 "$sha" > /tmp/commit-message
            python3 .github/scripts/check-conventional-commit.py /tmp/commit-message
          done

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Install prek
        run: python3 -m pip install --user prek

      - name: Run prek pre-commit hooks
        run: ~/.local/bin/prek run --all-files

      - name: Run prek pre-push hooks
        run: ~/.local/bin/prek run --all-files --hook-stage pre-push

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Verify crates.io package
        run: cargo publish --dry-run --allow-dirty

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
