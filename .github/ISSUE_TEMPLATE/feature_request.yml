name: Feature request
description: Suggest a workflow improvement for tissues.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to do in GitHub issues or Projects?
      placeholder: "I want to..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current friction
      description: What is slow, confusing, or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the UI, command, keybinding, or behavior you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
