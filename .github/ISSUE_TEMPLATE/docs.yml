name: Documentation issue
description: Report missing or unclear documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Link or name the README/user guide section.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
    validations:
      required: false
